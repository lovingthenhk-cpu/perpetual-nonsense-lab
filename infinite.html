<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1015">
<title>無限展示室 | 無意味博物館</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/style.css">
<style>
.infinite-head{padding:55px 5% 40px;border-bottom:1px solid #425346}.infinite-head .back{font:11px var(--mono);color:var(--acid);display:inline-block;margin-bottom:55px}.infinite-head h1{font-size:clamp(46px,7.3vw,108px);line-height:1.1;letter-spacing:-.08em;margin:15px 0}.infinite-head h1 span{color:var(--acid)}.infinite-head>p{color:#a9b9ad;line-height:2;font-size:14px}.infinite-status{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;padding:22px 5%;border-bottom:1px solid #425346;font:11px var(--mono);color:var(--acid)}.infinite-controls{display:flex;gap:10px;flex-wrap:wrap}.infinite-controls button{padding:8px 13px;background:transparent;color:var(--acid);border:1px solid #5a7255;font:11px var(--mono)}.infinite-controls button:hover{background:var(--acid);color:#112016}.infinite-progress{height:3px;background:#233126}.infinite-progress div{height:100%;background:var(--acid);width:0}.infinite-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:20px 5% 100px}.infinite-card{background:#141d1a;border:1px solid #344d3b;overflow:hidden;cursor:pointer;text-align:left;color:var(--ink);padding:0}.infinite-card:hover{border-color:var(--acid)}.infinite-card canvas{display:block;width:100%;height:auto;aspect-ratio:1.35;background:#12211c}.infinite-info{padding:16px 17px 20px}.infinite-info .ii-top{display:flex;justify-content:space-between;color:var(--acid);font:10px var(--mono)}.infinite-info h2{font-size:20px;margin:12px 0 0}.infinite-info p{color:#839c86;font:10px var(--mono)}.infinite-void{padding:60px 5%;color:var(--muted);font:13px var(--mono)}#detail{position:fixed;inset:0;background:#0b1110eb;z-index:150;display:none;align-items:center;justify-content:center;padding:20px}#detail.open{display:flex}.detail-box{width:min(920px,100%);background:#17231d;border:1px solid #6d865f;padding:22px}.detail-bar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:15px}.detail-bar h2{margin:0;font-size:23px}.detail-bar button{background:none;border:0;color:var(--acid);font:17px var(--mono)}#detailcanvas{display:block;width:100%;height:auto;background:#0e1613;aspect-ratio:1.55}.detail-note{font:11px var(--mono);color:#b0c4aa;margin-top:12px}@media(max-width:850px){.infinite-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){.infinite-grid{grid-template-columns:1fr}.infinite-status{gap:15px}}
</style></head>
<body><div class="grain"></div><div class="shell">
<div class="infinite-head"><a class="back" href="./">← MUSEUM OF NOTHING / 戻る</a><div class="eyebrow"><span class="square"></span>A MACHINE WITHOUT A FINISH LINE</div><h1>無限<span>展示室</span><span style="color:var(--acid)">.</span></h1><p>目的も、審査も、完成もありません。<br>この展示室は開いているあいだ約9秒ごとに、どこにも存在しなかった物体を生成します。<br>生成結果はこのブラウザに保存されます。永遠の稼働を保証するものではありません。</p></div>
<div class="infinite-status"><div><span class="blink-dot" style="display:inline-block;margin-right:9px"></span><span id="live-state">GENERATING</span> / CREATED <span id="live-count">0000</span></div><div class="infinite-controls"><button id="make">+ 今すぐ生成</button><button id="pause">一時停止</button><button id="clear">ローカル履歴を消す</button></div></div>
<div class="infinite-progress"><div id="pulse"></div></div>
<div id="infinite-grid" class="infinite-grid"></div>
<div id="detail" role="dialog" aria-modal="true" aria-label="生成作品"><div class="detail-box"><div class="detail-bar"><h2 id="detail-title"></h2><button id="detail-close" aria-label="閉じる">× CLOSE</button></div><canvas id="detailcanvas" width="900" height="580"></canvas><p class="detail-note">NO. <span id="detail-seed"></span> — 意味の検索に失敗しました。</p></div></div>
<footer><div><span class="footer-symbol">∅</span><strong>MUSEUM OF NOTHING</strong></div><div>生成処理はお使いの端末上で実行されます。</div></footer></div>
<script src="assets/infinite.js" defer></script></body></html>
